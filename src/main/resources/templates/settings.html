<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Asa - Settings</title>
</head>

<body class="bg-gray-50 font-sans antialiased text-gray-800">

<div th:replace="fragments/header :: header"></div>

<main class="mx-auto px-6 py-12 max-w-2xl">
    <h1 class="text-4xl font-bold text-[#3F2F6A] mb-6">Settings</h1>

    <div th:if="${toastMessage}"
         th:classappend="${toastType == 'error'} ? 'bg-red-100 text-red-800 border-red-300' : 'bg-green-100 text-green-800 border-green-300'"
         class="mb-6 px-4 py-3 border rounded-lg">
        <span th:text="${toastMessage}"></span>
    </div>

    <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-semibold text-[#3F2F6A] mb-2">Contract alert threshold</h2>
        <p class="text-gray-600 mb-6">
            Lorsqu'un pointage est enregistre et qu'il reste <strong>moins</strong> que ce nombre
            de jours sur le contrat du collaborateur, un email d'alerte est envoye aux comptables.
        </p>

        <form th:action="@{/settings}" method="post" class="space-y-6">
            <div>
                <label for="lowContractDaysThreshold" class="block text-gray-700 font-semibold mb-2">
                    Seuil (en jours) :
                </label>
                <input
                        type="number"
                        min="0"
                        step="1"
                        id="lowContractDaysThreshold"
                        name="lowContractDaysThreshold"
                        th:value="${lowContractDaysThreshold}"
                        required
                        class="w-1/3 min-w-[120px] px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"/>
            </div>

            <button type="submit"
                    class="py-3 px-6 bg-[#9933CC] hover:bg-[#7A29A5] text-white font-semibold rounded-lg shadow-md focus:ring-2 focus:ring-blue-500">
                Save
            </button>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
