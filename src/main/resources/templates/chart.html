<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ThProduct Pie Chart</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
<div align="center">
    <div id="piechart" style="width: 900px; height: 500px;"></div>
    <button onclick="downloadChart()">Download as PNG</button>
</div>

<script th:inline="javascript">
    let real_data = /*[[${chartData}]]*/ {};

    let chartDataTable;
    let chartInstance;

    $(document).ready(function () {
        google.charts.load('current', {
            packages: ['corechart']
        });
        google.charts.setOnLoadCallback(drawPieChart);
    });

    function drawPieChart() {
        chartDataTable = new google.visualization.DataTable();
        chartDataTable.addColumn('string', 'ThProduct');
        chartDataTable.addColumn('number', 'Executed Days');

        Object.keys(real_data).forEach(function (key) {
            chartDataTable.addRow([key, real_data[key]]);
        });

        const options = {
            title: 'Time Spent per Product',
            titleTextStyle: {
                fontSize: 17
            },
            is3D: true,
            legend: {
                textStyle: {
                    fontSize: 15
                }
            }
        };

        chartInstance = new google.visualization.PieChart(document.getElementById('piechart'));
        chartInstance.draw(chartDataTable, options);
    }

    function downloadChart() {
        if (!chartInstance) return;
        const imageURI = chartInstance.getImageURI();
        const link = document.createElement('a');
        link.href = imageURI;
        link.download = 'products_chart.png';
        link.click();
    }
</script>
</body>
</html>
