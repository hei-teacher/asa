<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Asa - Missions by Products</title>
    <link href="/main.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-800">
<div th:replace="fragments/header :: header"></div>

<div class="ml-6 mr-6 mt-6">
    <h2 class="text-xl font-bold mb-2">Worker</h2>
    <div th:replace="fragments/workerSelector :: workerSelector(missions, All)"></div>

    <h2 class="text-xl font-bold mt-6" th:text="'Missions by Products - ' + ${worker == null ? 'All' : worker.name()}"></h2>
    <strong>"st="</strong> refers to days executed by a <strong>st</strong>udent worker.
</div>

<div class="ml-6 mr-6 flex gap-6">
    <ul class="ml-6 mt-9 list-disc w-1/2">
        <li th:each="p: ${products}" class="mb-4">
            <strong class="text-lg font-semibold"
                    th:text="${p.code()} + ': ' + ${p.name()} + ' (' + ${#numbers.formatDecimal(p.executedDays(), 1, 2)} + ' | st=' + ${#numbers.formatDecimal(p.studentExecutedDays(), 1, 2)} + ')' "
                    th:title="${p.description()}">
            </strong>
            <ul class="ml-6 list-disc">
                <li th:each="m: ${p.missions()}"
                    class="ml-4 text-sm"
                    th:text="${m.getCode()} + ': ' + ${m.getTitle()} + ' (' + ${#numbers.formatDecimal(m.executedDays(), 1, 2)}  + ' | st=' + ${#numbers.formatDecimal(m.studentExecutedDays(), 1, 2)} + ')' "
                    th:title="${m.getDescription()}">
                </li>
            </ul>
        </li>
    </ul>

    <table class="w-1/2">
        <thead>
        <tr>
            <th th:each="month : ${months.keySet()}"
                style="text-align:center" class="w-1/12 text-center"
                th:text="${#strings.capitalize(month)}">
            </th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="w-1/12 text-center"
                th:each="month : ${T(java.time.Month).values()}">
                <ul class="list-none text-center">
                    <li th:each="p : ${months[month.toString().toLowerCase()]}" class="mb-4 text-center">
                        <strong class="text-lg font-semibold"
                                th:text="${p.executedDays() > 0 ? #numbers.formatDecimal(p.executedDays(), 1, 2) : '-'}">
                        </strong>
                        <ul class="list-none text-center">
                            <li th:each="m: ${p.missions()}" class="text-sm text-center"
                                th:text="${m.executedDays() > 0 ? #numbers.formatDecimal(m.executedDays(), 1, 2) : '-'}">
                            </li>
                        </ul>
                    </li>
                </ul>
            </td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td class="w-1/12 text-center font-bold"
                th:each="month : ${T(java.time.Month).values()}">
                <ul class="list-none text-center">
                    <li th:each="t : ${total[month.toString().toLowerCase()]}" class="mb-4 text-center">
                        <strong class="text-lg font-semibold"
                                th:text="${#numbers.formatDecimal(t, 1, 2)}">
                        </strong>
                    </li>
                </ul>
            </td>
        </tr>
        </tfoot>
    </table>

    <script>
        function updateFilters() {
            const workerCode = document.getElementById("worker").value;
            window.location.href = `/missions?workerCode=${workerCode}`;
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("worker").addEventListener("change", updateFilters);
        });
    </script>
</div>

<!-- Manomboka eto l fanaovana an'l graphe -->
<h2 class="text-xl font-bold mt-10 mb-4 ml-6 mr-6">Graphique : Temps total passé par groupe de missions</h2>
<div class="ml-6 mr-6">
    <svg id="missionsGraph" width="900" height="500"></svg>
    <button id="downloadBtn" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Télécharger le graphe</button>
</div>

<script th:inline="javascript">
    const groups = /*[[${totalByGroup}]]*/ [];

    const svg = document.getElementById("missionsGraph");
    const width = svg.clientWidth;
    const height = svg.clientHeight;
    const margin = {top: 20, right: 20, bottom: 120, left: 60};
    const chartWidth = width - margin.left - margin.right;
    const chartHeight = height - margin.top - margin.bottom;

    if(groups.length === 0) {
    } else {
        const maxValue = Math.max(...groups.map(g => parseFloat(g.executedDays)));

        groups.forEach((group, index) => {
            const value = parseFloat(group.executedDays);
            const barWidth = chartWidth / groups.length;
            const barHeight = (value / maxValue) * chartHeight;
            const x = margin.left + index * barWidth;
            const y = margin.top + (chartHeight - barHeight);

            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x);
            rect.setAttribute("y", y);
            rect.setAttribute("width", barWidth - 2);
            rect.setAttribute("height", barHeight);
            rect.setAttribute("fill", "steelblue");
            svg.appendChild(rect);

            // eto n manisy an'l label ambanin'l barre
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", x + barWidth / 2);
            label.setAttribute("y", height - 40);
            label.setAttribute("text-anchor", "middle");
            label.setAttribute("font-size", "12");
            label.setAttribute("transform", `rotate(45 ${x + barWidth / 2} ${height - 40})`);
            label.textContent = group.groupName;
            svg.appendChild(label);

            // eto n manisy an'l valeur ambonin'ny graphe
            const valueLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            valueLabel.setAttribute("x", x + barWidth / 2);
            valueLabel.setAttribute("y", y - 5);
            valueLabel.setAttribute("text-anchor", "middle");
            valueLabel.setAttribute("font-size", "12");
            valueLabel.textContent = value.toFixed(1);
            svg.appendChild(valueLabel);
        });
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        //eto n mamadika an'l svg ho png amzay afaka telechargena
        const serializer = new XMLSerializer();
        let source = serializer.serializeToString(svg);

        if(!source.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)){
            source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if(!source.match(/^<svg[^>]+"http:\/\/www\.w3\.org\/1999\/xlink"/)){
            source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }

        const svgBlob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = svg.clientWidth;
            canvas.height = svg.clientHeight;
            const context = canvas.getContext('2d');
            context.fillStyle = 'white';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(img, 0, 0);

            const pngFile = canvas.toDataURL('image/png');

            const a = document.createElement('a');
            a.href = pngFile;
            a.download = 'missions_graph.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            URL.revokeObjectURL(url);
        };
        img.src = url;
    });
</script>

</body>
</html>
