name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

  workflow_call:



jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-3
      ACCOUNTANTS: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_ACCOUNTANTS ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_ACCOUNTANTS ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_ACCOUNTANTS ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_ACCOUNTANTS
              }}
      MAX_LATENESS_REPORT: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_MAX_LATENESS_REPORT ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_MAX_LATENESS_REPORT ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_MAX_LATENESS_REPORT ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_MAX_LATENESS_REPORT
              }}
      SENSITIVE_WORKERS_CODES: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_SENSITIVE_WORKERS_CODES ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_SENSITIVE_WORKERS_CODES ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_SENSITIVE_WORKERS_CODES ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_SENSITIVE_WORKERS_CODES
              }}


    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: chmod +x gradlew
      - run: chmod +x .shell/publish_gen_to_maven_local.sh
      - run: |
          ./gradlew test \
            -Daccountants="$ACCOUNTANTS" \
            -Dmax.lateness.report="$MAX_LATENESS_REPORT" \
            -Dsensitive.workers.codes="$SENSITIVE_WORKERS_CODES"

      

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x format.sh
      - run: ./format.sh && git diff --exit-code