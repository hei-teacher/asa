<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Asa - Profile</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:replace="fragments/header :: header"></div>

<main class="flex-grow container mx-auto py-12 px-4">
    <div class="max-w-xl mx-auto bg-white shadow-md rounded-xl p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">My profile</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-gray-500">Name :</label>
                <p class="text-lg font-medium text-gray-800" th:text="${worker.name}">Nom</p>
            </div>
            <div>
                <label class="block text-gray-500">Email :</label>
                <p class="text-lg font-medium text-gray-800" th:text="${worker.email}">Email</p>
            </div>
            <div>
                <label class="block text-gray-500">Code :</label>
                <p class="text-lg font-medium text-gray-800" th:text="${worker.code}">Code</p>
            </div>
            <div>
                <label class="block text-gray-500">Type :</label>
                <p class="text-lg font-medium text-gray-800" th:text="">Type</p>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
