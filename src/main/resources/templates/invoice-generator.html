<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Generator</title>
    <link href="/main.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="m-0 h-screen flex flex-col">

<div th:replace="fragments/header :: header"></div>

<div class="flex flex-1 overflow-hidden">
    <!-- Left section -->
    <div class="w-1/2 p-5 bg-gray-100 box-border">
        <h1 class="text-4xl font-bold text-[#3F2F6A] mt-10 mb-10">Generate your monthly invoice</h1>

        <div class="flex space-x-6 mb-6">
            <div class="w-1/2">
                <label for="ref" class="block text-gray-800 font-semibold mb-1">Référence :</label>
                <textarea
                        id="ref"
                        rows="1"
                        name="ref"
                        placeholder="FAC2025/01/01"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>

            <div class="w-1/2">
                <label for="date" class="block text-gray-700 font-semibold mb-1">Date d'émission :</label>
                <div class="relative">
                    <input
                            type="text"
                            id="date"
                            name="date"
                            placeholder="Select a date"
                            class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
                    />
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                <i class="material-icons">event</i>
            </span>
                </div>
            </div>
        </div>

        <div class="flex space-x-6 mb-6">
            <div class="w-1/2">
                <label for="desc" class="block text-gray-800 font-semibold mb-1">Description :</label>
                <textarea
                        id="desc"
                        rows="1"
                        name="ref"
                        placeholder="Consultant - Développeur Logiciel (1j)"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>

            <div class="w-1/2">
                <label for="qtt" class="block text-gray-800 font-semibold mb-1">Quantité :</label>
                <textarea
                        id="qtt"
                        rows="1"
                        name="ref"
                        placeholder="10"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>
        </div>

        <div class="flex space-x-6 mb-6">
            <div class="w-1/2">
                <label for="px" class="block text-gray-800 font-semibold mb-1">Prix unitaire :</label>
                <textarea
                        id="px"
                        rows="1"
                        name="ref"
                        placeholder="50 000 Ar"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>

            <div class="w-1/2">
                <label for="mtt" class="block text-gray-800 font-semibold mb-1">Montant :</label>
                <textarea
                        id="mtt"
                        rows="1"
                        name="ref"
                        placeholder="500 000 Ar"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>
        </div>

        <div class="flex space-x-6 mb-6">
            <div class="w-1/2">
                <label for="tot" class="block text-gray-800 font-semibold mb-1">Total :</label>
                <textarea
                        id="tot"
                        rows="1"
                        name="ref"
                        placeholder="500 000 Ar"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-none"
                ></textarea>
            </div>
        </div>
    </div>

    <!-- Right section -->
    <div class="w-1/2 h-full overflow-auto">
        <img th:src="'data:image/png;base64,' + ${invoiceData}" class="w-full h-auto" alt="Invoice Preview"/>
    </div>
</div>

<script>
    function getFormData() {
        return {
            reference: document.getElementById('ref').value,
            issueDate: document.getElementById('date').value,
            description: document.getElementById('desc').value,
            quantity: document.getElementById('qtt').value,
            unitPrice: document.getElementById('px').value,
            amount: document.getElementById('mtt').value,
            total: document.getElementById('tot').value
        };
    }

    async function updateInvoiceData() {
        const formData = getFormData();
        window.location.href = `/invoice?invoiceForm=${formData}`;
    }

    document.querySelectorAll('textarea, input').forEach(el => {
        el.addEventListener('input', updateInvoiceData);
    });

    document.addEventListener("DOMContentLoaded", function () {
        const currentYear = new Date().getFullYear();
        flatpickr("#date", {
            minDate: `01/01/${currentYear}`,
            maxDate: `31/12/${currentYear}`,
            dateFormat: "d/m/Y"
        });
    });
</script>

</body>
</html>
