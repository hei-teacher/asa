<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Asa - Mission Executions</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="/main.css" rel="stylesheet"/>
</head>

<body class="bg-gray-50 text-gray-800">

<div th:replace="fragments/header :: header"></div>

<div class="max-w-4xl mx-auto pt-6">
    <div th:replace="fragments/workerSelector :: workerSelector(mission-executions, All)"></div>

    <input id="monthPicker" type="month"
           th:value="${month}"
           onchange="updateMonth(this.value)"
           style="margin-top: 20px;" />
</div>

<div class="max-w-4xl mx-auto my-6 space-y-6">
    <h2 class="text-2xl font-semibold text-[#3F2F6A]"
        th:text="'Missions Executed by ' + (${worker == null ? 'All' : worker.name()})"></h2>
    <p class="text-sm text-gray-500 mt-1">Care missions are <span
            class="text-red-500 font-semibold">highlighted in red</span>.</p>

    <div th:each="dailyExecution: ${dailyExecutions}" class="bg-white p-6 shadow-lg rounded-lg">

        <div class="text-[#3F2F6A] py-2 px-4 rounded-md font-semibold text-lg">
            <span th:text="${#strings.toUpperCase(#temporals.format(dailyExecution.date(), 'EEEE dd MMMM yyyy', T(java.util.Locale).ENGLISH))}"></span>
        </div>

        <div class="mt-4 space-y-4">
            <div th:each="thMe: ${dailyExecution.thExecutionsPerMission()}"
                 class="p-4 border-l-4 rounded-lg shadow bg-white"
                 th:classappend="'text-' + ${#strings.substring(thMe.mission().code(), 0, 2)}">

                <h3 class="text-lg font-semibold"
                    th:text="${thMe.mission().code()} + ': ' + ${thMe.mission().title()}">
                </h3>

                <ul class="mt-2 space-y-2">
                    <li th:each="me: ${thMe.executions()}"
                        class="flex flex-col text-sm text-gray-700"
                        th:classappend="'text-' + ${#strings.substring(me.mission().code(), 0, 2)}">

                        <div class="border border-gray-100 rounded-lg bg-gray-50 p-3">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-black" th:text="${me.worker().name()}"></span>
                                <span class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-xs font-semibold"
                                      th:text="${me.dayPercentage()} + '%'"></span>
                            </div>
                            <p class="mt-2 text-gray-600 italic" th:text="${me.comment()}"></p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</div>

<script>
    function updateMonth(selectedMonth) {
        window.location.href = '/mission-executions?yearMonth=' + selectedMonth;
    }
</script>
</body>

</html>
