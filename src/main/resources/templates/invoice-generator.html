<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Generator</title>
    <link href="/main.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 h-screen flex flex-col">

<!-- Header en haut -->
<div th:replace="fragments/header :: header"></div>

<!-- Contenu principal -->
<div class="flex flex-1 overflow-hidden">
    <!-- Left section -->
    <div class="w-1/2 p-5 bg-gray-100 box-border">
        <h2 class="text-2xl font-semibold mb-4">Facture générée</h2>
        <p class="mb-4">Voici un aperçu du PDF généré avec Thymeleaf.</p>
        <a href="/invoice/download" target="_blank" class="text-blue-600 hover:underline flex items-center gap-1">
            📥 Télécharger le PDF
        </a>
    </div>

    <!-- Right section -->
    <div class="w-1/2 h-full overflow-auto">
        <img th:src="'data:image/png;base64,' + ${invoiceData}" class="w-full h-auto" alt="Invoice Preview"/>
    </div>
</div>

</body>
</html>
